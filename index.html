}

async function qcLoadAnalytics(kind){
  const bodyEl=document.getElementById('qcp-sec-overview');
  const mainWrap=document.querySelector('.qcp-shell');
  if(!mainWrap) return;
  const cached=_qcAnalyticsCache[kind];
  const FRESH_MS=5*60*1000;
  if(cached&&(Date.now()-cached.ts)<FRESH_MS){
    qcpOnDataLoaded();
    return;
  }
  const setMsg=(html)=>{ const el=document.getElementById('main'); if(el) el.querySelector('.qcp-shell') && (document.getElementById('qcp-sec-overview').innerHTML=html); };
  if(!qcWebhookConfigured()){
    document.getElementById('qcp-sec-overview').hidden=false;
    document.getElementById('qcp-sec-overview').innerHTML=`<div style="padding:40px;text-align:center;color:#94a3b8">&#9888; Save endpoint not configured yet — see google-apps-script/Code.gs</div>`;
    return;
  }
  if(!qcAuthConfigured()){
    document.getElementById('qcp-sec-overview').hidden=false;
    document.getElementById('qcp-sec-overview').innerHTML=`<div style="padding:40px;text-align:center;color:#94a3b8">&#9888; Google Sign-In not configured yet — see google-apps-script/Code.gs</div>`;
    return;
  }
  if(!qcIsSignedIn()){
    document.getElementById('qcp-sec-overview').hidden=false;
    document.getElementById('qcp-sec-overview').innerHTML=`<div style="padding:40px;text-align:center;color:#94a3b8">&#9888; Please sign in with your Google account (top right) to view analytics.</div>`;
    if(typeof google!=='undefined' && google.accounts) google.accounts.id.prompt();
    return;
  }
  document.getElementById('qcp-sec-overview').hidden=false;
  document.getElementById('qcp-sec-overview').innerHTML=`<div style="padding:40px;text-align:center;color:#94a3b8">Loading…</div>`;
  try{
    const [auditsRes,rosterRes,missRes]=await Promise.all([
      fetch(QC_WEBHOOK_URL,{method:'POST',body:JSON.stringify({action:'list',kind,idToken:qcAuthToken})}).then(r=>r.json()),
      fetch(QC_WEBHOOK_URL,{method:'POST',body:JSON.stringify({action:'rosterList',kind,idToken:qcAuthToken})}).then(r=>r.json()),
      fetch(QC_WEBHOOK_URL,{method:'POST',body:JSON.stringify({action:'missLogList',idToken:qcAuthToken})}).then(r=>r.json())
    ]);
    if(auditsRes.status!=='ok') throw new Error(auditsRes.message||'Unknown error loading audits');
    if(rosterRes.status!=='ok') throw new Error(rosterRes.message||'Unknown error loading the roster');
    if(missRes.status!=='ok') throw new Error(missRes.message||'Unknown error loading the miss log');
    const combined={audits:auditsRes.audits||[], roster:rosterRes.agents||[], missLog:missRes.rows||[]};
    _qcAnalyticsCache[kind]={data:combined,ts:Date.now()};
    qcpOnDataLoaded();
  }catch(err){
    // The message alone doesn't say WHERE it broke, and this can be a real
    // rendering bug (not just a network/auth failure) — qcpOnDataLoaded()
    // above runs entirely inside this try, so a bug anywhere in rendering
    // real data lands here too. Log the full stack so it's diagnosable from
    // the console instead of just the one-line message shown on screen.
    console.error('QC Analytics load/render failed:',err);
    document.getElementById('qcp-sec-overview').innerHTML=`<div style="padding:40px;text-align:center;color:#dc2626">&#10005; Could not load analytics: ${escHtml(err.message)}</div>`;
  }
}

function qcpOnDataLoaded(){
  // Re-render the shell fresh if the KPI row (or anything else this
  // function populates) isn't there to populate — not just if the outer
  // .qcp-shell wrapper is missing. qcLoadAnalytics's "not configured/not
  // signed in/error" branches overwrite qcp-sec-overview's inner content
  // (including qcpKpiRow) with a plain message, leaving .qcp-shell itself
  // still in the DOM — a stale sign-in warning followed by Refresh (which
  // never rebuilds the shell) would otherwise land here with .qcp-shell
  // present but qcpKpiRow gone, crashing every render function below.
  if(!document.getElementById('qcpKpiRow')){
    document.getElementById('main').innerHTML=renderQCAnalyticsShell();
  }
  const dir=qcpDirectory();
  if(!_qcp.programs) _qcp.programs=new Set(dir.programs);
  if(!_qcp.teamLeaders) _qcp.teamLeaders=new Set(dir.teamLeaders);
  qcpActivateSection(_qcp.section);
  qcpRenderAll();
}

// ══════════════════════════════════════════════════════════════
//  data access + real aggregation
// ══════════════════════════════════════════════════════════════
function qcpData(){ const c=_qcAnalyticsCache[_qcAnalyticsKind]; return c?c.data:null; }
function qcpAudits(){ const d=qcpData(); return d?(d.audits||[]):[]; }
function qcpRoster(){ const d=qcpData(); return d?(d.roster||[]):[]; }
function qcpMissLog(){ const d=qcpData(); return d?(d.missLog||[]):[]; }

function qcpNormName(s){ return String(s==null?'':s).trim().toLowerCase(); }
function qcpEscJs(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' '); }

function qcpBuildRosterIndex(rosterAgents){
  const exact=new Map(), norm=new Map();
  (rosterAgents||[]).forEach(r=>{
    if(!r||!r.name) return;
    exact.set(r.name,r);
    const nk=qcpNormName(r.name);
    if(!norm.has(nk)) norm.set(nk,r);
  });
  return {exact,norm};
}
function qcpFindRoster(idx,name){
  if(!name) return null;
  if(idx.exact.has(name)) return idx.exact.get(name);
  return idx.norm.get(qcpNormName(name))||null;
}

// Union of every agent seen in either the QC audits or the Roster sheet,
// with a single resolved Team Leader per agent: prefer the Roster's
// teamLeader field (name-matched, exact then case/whitespace-insensitive),
// falling back to the most common teamLeader recorded across that agent's
// own QC audits when the agent isn't in the Roster at all.
function qcpDirectory(){
  const data=qcpData();
  if(!data) return {agents:[],programs:[],teamLeaders:[]};
  if(_qcpDirCache && _qcpDirCache.data===data) return _qcpDirCache;
  const rosterIdx=qcpBuildRosterIndex(data.roster||[]);
  const byName=new Map();
  (data.audits||[]).forEach(a=>{
    const name=(a.agent||'').toString();
    if(!name) return;
    if(!byName.has(name)) byName.set(name,{name,programs:new Set(),auditTLCounts:{}});
    const e=byName.get(name);
    if(a.program) e.programs.add(a.program);
    if(a.teamLeader) e.auditTLCounts[a.teamLeader]=(e.auditTLCounts[a.teamLeader]||0)+1;
  });
  (data.roster||[]).forEach(r=>{
    const name=(r.name||'').toString();
    if(!name) return;
    if(!byName.has(name)) byName.set(name,{name,programs:new Set(),auditTLCounts:{}});
  });
  const programSet=new Set();
  (data.audits||[]).forEach(a=>{ if(a.program) programSet.add(a.program); });
  const tlSet=new Set();
  const agents=[];
  byName.forEach((e,name)=>{
    const rr=qcpFindRoster(rosterIdx,name);
    let tl=(rr&&rr.teamLeader)?rr.teamLeader:'';
    if(!tl){
      let best=null,bestN=-1;
      Object.entries(e.auditTLCounts).forEach(([k,v])=>{ if(v>bestN){best=k;bestN=v;} });
      tl=best||'(Unknown)';
    }
    tlSet.add(tl);
    agents.push({name,programs:e.programs,teamLeader:tl,rosterRow:rr});
  });
  agents.sort((a,b)=>a.name.localeCompare(b.name));
  _qcpDirCache={data,agents,programs:[...programSet].sort(),teamLeaders:[...tlSet].sort(),rosterIdx};
  return _qcpDirCache;
}
function qcpAgentTL(name){
  const dir=qcpDirectory();
  const e=dir.agents.find(x=>x.name===name);
  return e?e.teamLeader:'(Unknown)';
}
function qcpRosterRowFor(name){
  return qcpFindRoster(qcpDirectory().rosterIdx,name);
}

function qcpBucketOf(label){
  if(QC_CRITICAL_ITEM_LABELS.has(label)) return 'critical';
  if(QC_DOCUMENTATION_ITEM_LABELS.has(label)) return 'documentation';
  if(QC_COMMUNICATION_ITEM_LABELS.has(label)) return 'communication';
  return null;
}
const QCP_BUCKETS=['critical','documentation','communication'];
const QCP_BUCKET_LABEL={critical:'Critical items',documentation:'Documentation & closing',communication:'Communication & expertise'};
function qcpBand(score){ return (score===null||score===undefined||isNaN(score))?'na':score<70?'fail':score<90?'warn':'pass'; }

function qcpAggregate(audits){
  const bucketCounts={critical:0,documentation:0,communication:0};
  const labelCounts={};
  let criticalCount=0, nonCriticalAuditCount=0, scoreSum=0, scoreCount=0;
  audits.forEach(a=>{
    const score=parseFloat(a.overallScore);
    if(!isNaN(score)){ scoreSum+=score; scoreCount++; }
    const fails=Array.isArray(a.failedFields)?a.failedFields:[];
    let hasCrit=false, hasNonCrit=false;
    fails.forEach(label=>{
      const b=qcpBucketOf(label);
      if(!b) return;
      bucketCounts[b]++;
      labelCounts[label]=(labelCounts[label]||0)+1;
      if(b==='critical') hasCrit=true; else hasNonCrit=true;
    });
    if(hasCrit) criticalCount++;
    if(hasNonCrit) nonCriticalAuditCount++;
  });
  const n=audits.length;
  const health=scoreCount? scoreSum/scoreCount : null;
  const nonCriticalCount=bucketCounts.documentation+bucketCounts.communication;
  return {n,bucketCounts,labelCounts,criticalCount,nonCriticalAuditCount,nonCriticalCount,health};
}

function qcpMonthKey(dateStr){ return dateStr? String(dateStr).slice(0,7) : ''; }
function qcpNextMonthKey(mk){
  const parts=mk.split('-'); const y=parseInt(parts[0],10), m=parseInt(parts[1],10);
  const nm=m===12?1:m+1, ny=m===12?y+1:y;
  return ny+'-'+String(nm).padStart(2,'0');
}
function qcpMonthLabel(key,multiYear){
  if(!key) return '—';
  const names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const parts=key.split('-');
  const y=parts[0], m=parseInt(parts[1],10);
  return names[m-1]+(multiYear?' '+y:'');
}
function qcpAllMonthKeys(audits){
  const set=new Set();
  audits.forEach(a=>{ if(a.auditDate) set.add(qcpMonthKey(a.auditDate)); });
  return [...set].sort();
}

// ---- ISO 8601 week key (Mon-based, Thursday rule) — used only to bucket
// real audit/roster dates into "week on week" trends; no fixed quarter. ----
function qcpIsoWeekKey(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  const target=new Date(d.valueOf());
  const dayNr=(d.getDay()+6)%7;
  target.setDate(target.getDate()-dayNr+3);
  const firstThursday=target.valueOf();
  target.setMonth(0,1);
  if(target.getDay()!==4) target.setMonth(0,1+((4-target.getDay())+7)%7);
  const week=1+Math.round((firstThursday-target.valueOf())/(7*86400000));
  return target.getFullYear()+'-W'+String(week).padStart(2,'0');
}

// ---- date-range filter (All Time / Today / Last 7 / Last 30 / Custom —
// same modes as the mock, using the REAL current date, not a fixed mock date) ----
function qcpTodayIso(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function qcpAddDaysIso(iso,n){
  const parts=iso.split('-').map(Number);
  const dt=new Date(parts[0],parts[1]-1,parts[2]);
  dt.setDate(dt.getDate()+n);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function qcpEffectiveDateRange(){
  const today=qcpTodayIso();
  if(_qcp.dateMode==='today') return [today,today];
  if(_qcp.dateMode==='7d') return [qcpAddDaysIso(today,-6),today];
  if(_qcp.dateMode==='30d') return [qcpAddDaysIso(today,-29),today];
  if(_qcp.dateMode==='custom') return [_qcp.dateFrom||null,_qcp.dateTo||null];
  return [null,null];
}
function qcpInDateRange(dateStr){
  const [from,to]=qcpEffectiveDateRange();
  if(!dateStr) return _qcp.dateMode==='all';
  if(from && dateStr<from) return false;
  if(to && dateStr>to) return false;
  return true;
}
function qcpFilteredAudits(opts){
  opts=opts||{};
  const progs=_qcp.programs, tls=_qcp.teamLeaders;
  return qcpAudits().filter(a=>{
    if(!opts.ignoreDate && !qcpInDateRange(a.auditDate)) return false;
    if(progs && a.program && !progs.has(a.program)) return false;
    if(tls){
      const tl=qcpAgentTL(a.agent||'');
      if(!tls.has(tl)) return false;
    }
    if(_qcp.focus && !opts.ignoreFocus){
      if(_qcp.focus.type==='agent' && a.agent!==_qcp.focus.name) return false;
      if(_qcp.focus.type==='teamLeader' && qcpAgentTL(a.agent||'')!==_qcp.focus.name) return false;
    }
    return true;
  });
}

// ---- Roster-derived per-agent figures (real, from action:'rosterList' —
// see the Roster section note in the task for the exact derivation) ----
function qcpTeamForAgentInRange(rr,fromIso,toIso){
  if(!rr || !Array.isArray(rr.daily)) return '—';
  const inRange=rr.daily.filter(d=> d.date && (!fromIso||d.date>=fromIso) && (!toIso||d.date<=toIso) && d.team && d.team!=='Leave');
  if(!inRange.length) return '—';
  const distinct=[...new Set(inRange.map(d=>d.team))];
  return distinct.join(' + ');
}
function qcpAttendanceForRange(rr,fromIso,toIso){
  if(!rr || !Array.isArray(rr.daily)) return {working:null,leave:null,pct:null};
  const inRange=rr.daily.filter(d=> d.date && (!fromIso||d.date>=fromIso) && (!toIso||d.date<=toIso));
  let working=0, leave=0;
  inRange.forEach(d=>{
    if(d.team==='Leave') leave++;
    else if(d.team) working++;
  });
  const denom=working+leave;
  return {working,leave,pct: denom? (working/denom*100) : null};
}
function qcpCasesForRange(rr,fromIso,toIso){
  if(!rr || !Array.isArray(rr.daily)) return 0;
  return rr.daily.filter(d=> d.date && (!fromIso||d.date>=fromIso) && (!toIso||d.date<=toIso))
    .reduce((s,d)=> s + (typeof d.counts==='number'? d.counts : 0), 0);
}
function qcpCasesByWeek(rr,weekKey){
  if(!rr || !Array.isArray(rr.daily)) return 0;
  return rr.daily.filter(d=> d.date && qcpIsoWeekKey(d.date)===weekKey && typeof d.counts==='number')
    .reduce((s,d)=>s+d.counts,0);
}

// ---- Escalations = Miss Log rows for that agent (exact string match on
// the `agent` field, same field the Coaching Queue already matches against
// QC audits) whose callDate falls in range. Any reason counts. ----
function qcpEscalationsForAgent(agentName,fromIso,toIso,missLog){
  return (missLog||[]).filter(r=> r.agent===agentName && r.callDate && (!fromIso||r.callDate>=fromIso) && (!toIso||r.callDate<=toIso)).length;
}
function qcpEscalationsForAgents(agentNames,fromIso,toIso,missLog){
  const set=new Set(agentNames);
  return (missLog||[]).filter(r=> set.has(r.agent) && r.callDate && (!fromIso||r.callDate>=fromIso) && (!toIso||r.callDate<=toIso)).length;
}

function qcpRepeatFlaggedAgents(audits){
  const byAgent=new Map();
  audits.forEach(a=>{ const n=a.agent; if(!n) return; if(!byAgent.has(n)) byAgent.set(n,[]); byAgent.get(n).push(a); });
  const flagged=new Set();
  byAgent.forEach((recs,agent)=>{
    const byMonth=new Map();
    recs.forEach(a=>{ const mk=qcpMonthKey(a.auditDate); if(!mk) return; if(!byMonth.has(mk)) byMonth.set(mk,[]); byMonth.get(mk).push(a); });
    byMonth.forEach((recs1,mk)=>{
      const nextKey=qcpNextMonthKey(mk);
      if(!byMonth.has(nextKey)) return;
      const recs2=byMonth.get(nextKey);
      const set1=new Set(); recs1.forEach(a=>(a.failedFields||[]).forEach(l=>{ if(QC_CRITICAL_ITEM_LABELS.has(l)) set1.add(l); }));
      const set2=new Set(); recs2.forEach(a=>(a.failedFields||[]).forEach(l=>{ if(QC_CRITICAL_ITEM_LABELS.has(l)) set2.add(l); }));
      for(const k of set1){ if(set2.has(k)) flagged.add(agent); }
    });
  });
  return flagged;
}
function qcpRenderKPIs(){
  const audits=qcpFilteredAudits();
  const agg=qcpAggregate(audits);
  const agentsInView=[...new Set(audits.map(a=>a.agent).filter(Boolean))];
  const [from,to]=qcpEffectiveDateRange();
  const escCount=qcpEscalationsForAgents(agentsInView,from,to,qcpMissLog());
  const cleanAgents=agentsInView.filter(name=>{
    const own=audits.filter(a=>a.agent===name);
    const g=qcpAggregate(own);
    return g.criticalCount===0 && g.nonCriticalCount===0;
  });
  const flagged=qcpRepeatFlaggedAgents(qcpFilteredAudits({ignoreDate:true}));
  const flaggedInView=agentsInView.filter(a=>flagged.has(a));
  const dir=qcpDirectory();
  const kpis=[
    {cls:'',eyebrow:'Audits evaluated',num:agg.n.toLocaleString(),sub:dir.programs.length+' programs · '+agentsInView.length+' agents'},
    {cls:'fail',eyebrow:'Critical errors',num:agg.criticalCount.toLocaleString(),sub:agg.n?((agg.criticalCount/agg.n*100).toFixed(1)+'% of audits'):'—'},
    {cls:'warn',eyebrow:'Non-critical errors',num:agg.nonCriticalCount.toLocaleString(),sub:agg.bucketCounts.documentation+' documentation · '+agg.bucketCounts.communication+' communication'},
    {cls:'accent',eyebrow:'Health score',num:agg.health!=null?agg.health.toFixed(1):'—',sub:'avg QC score, current filters'},
    {cls:'pass',eyebrow:'Fully clean agents',num:cleanAgents.length+' / '+agentsInView.length,sub:'zero critical, zero non-critical'},
    {cls:'',eyebrow:'Repeat-pattern flags',num:flaggedInView.length,sub:'same critical item, back-to-back months'},
    {cls:'warn',eyebrow:'Escalations',num:escCount.toLocaleString(),sub:'Miss Log rows, current filters'}
  ];
  document.getElementById('qcpKpiRow').innerHTML=kpis.map(k=>
    `<div class="qcp-kpi ${k.cls}"><div class="qcp-eyebrow">${escHtml(k.eyebrow)}</div><div class="qcp-num qcp-tabular">${k.num}</div><div class="qcp-sub">${escHtml(k.sub)}</div></div>`).join('');

  let topL=null,topC=-1;
  Object.entries(agg.labelCounts).forEach(([k,v])=>{ if(v>topC){topC=v;topL=k;} });
  const scopeNoDate=qcpFilteredAudits({ignoreDate:true});
  const monthsAll=qcpAllMonthKeys(scopeNoDate);
  const multiYear=new Set(monthsAll.map(k=>k.slice(0,4))).size>1;
  const byMonthAgg=monthsAll.map(mk=>qcpAggregate(scopeNoDate.filter(a=>qcpMonthKey(a.auditDate)===mk)));
  let sentence='';
  if(topL){
    const b=qcpBucketOf(topL);
    sentence=`<strong>${escHtml(topL)}</strong> (${QCP_BUCKET_LABEL[b]||'Uncategorized'}) is the most common failure in view right now — ${topC} occurrence${topC===1?'':'s'} across the selected filters. `;
  } else sentence='No failures at all in the current filter — every scored item passed. ';
  if(byMonthAgg.length>=2){
    const first=byMonthAgg[0], last=byMonthAgg[byMonthAgg.length-1];
    const firstCritRate=first.n? first.criticalCount/first.n*100:0, lastCritRate=last.n? last.criticalCount/last.n*100:0;
    const firstDocRate=first.n? first.bucketCounts.documentation/first.n*100:0, lastDocRate=last.n? last.bucketCounts.documentation/last.n*100:0;
    const critDelta=lastCritRate-firstCritRate, docDelta=lastDocRate-firstDocRate;
    const spanLabel=qcpMonthLabel(monthsAll[0],multiYear)+'→'+qcpMonthLabel(monthsAll[monthsAll.length-1],multiYear);
    sentence+= critDelta<-0.05? `Critical-failure rate is trending down (${critDelta.toFixed(1)} pts, ${spanLabel}). ` : critDelta>0.05? `Critical-failure rate is trending up (+${critDelta.toFixed(1)} pts, ${spanLabel}) — worth a closer look. ` : '';
    sentence+= docDelta<-0.05? `Documentation is improving too (${docDelta.toFixed(1)} pts).` : docDelta>0.05? `Documentation is slipping (+${docDelta.toFixed(1)} pts).` : '';
  }
  document.getElementById('qcpInsightBox').innerHTML=`<div class="qcp-ico" aria-hidden="true">i</div><p>${sentence}</p>`;

  const box=document.getElementById('qcpAgentFocusBox');
  if(_qcp.focus && _qcp.focus.type==='agent'){
    box.hidden=false;
    box.innerHTML=`<span class="qcp-name">${escHtml(_qcp.focus.name)}</span>
      <span class="qcp-stat">Team leader<br><b>${escHtml(qcpAgentTL(_qcp.focus.name))}</b></span>
      <span class="qcp-stat">Audits (date range)<br><b class="qcp-tabular">${agg.n}</b></span>
      <span class="qcp-stat">Health score<br><b class="qcp-tabular">${agg.health!=null?agg.health.toFixed(1):'—'}</b></span>
      <span class="qcp-stat">Critical errors<br><b class="qcp-tabular">${agg.criticalCount}</b></span>
      <span class="qcp-stat">Non-critical errors<br><b class="qcp-tabular">${agg.nonCriticalCount}</b></span>
      <span class="qcp-stat">Repeat-pattern flag<br><b>${flagged.has(_qcp.focus.name)?'Yes':'No'}</b></span>`;
  } else box.hidden=true;

  qcpRenderNeedsAttention(flagged,audits);
}
function qcpRenderNeedsAttention(flagged,audits){
  const byAgent=new Map();
  audits.forEach(a=>{ const n=a.agent; if(!n) return; if(!byAgent.has(n)) byAgent.set(n,[]); byAgent.get(n).push(a); });
  const rows=[...byAgent.entries()].map(([a,rs])=>({agent:a,agg:qcpAggregate(rs)})).filter(r=>r.agg.n>0 && r.agg.health!=null).sort((a,b)=>a.agg.health-b.agg.health).slice(0,5);
  const list=document.getElementById('qcpAttnList');
  list.innerHTML = rows.length? rows.map((r,i)=>`<div class="qcp-attn-row" onclick="qcpJumpToAgent('${qcpEscJs(r.agent)}')">
      <span class="qcp-attn-rank">${i+1}</span>
      <span class="qcp-attn-name">${escHtml(r.agent)}${flagged.has(r.agent)?`<span class="qcp-flag" style="cursor:pointer" title="See the repeating critical errors" onclick="event.stopPropagation();qcpOpenRepeatDetail('${qcpEscJs(r.agent)}')">repeat</span>`:''}</span>
      <span class="qcp-attn-tl">${escHtml(qcpAgentTL(r.agent))}</span>
      <span class="qcp-badge ${qcpBand(r.agg.health)}">${r.agg.health.toFixed(1)}</span>
      <span class="qcp-attn-tl qcp-tabular">${r.agg.criticalCount} critical · ${r.agg.nonCriticalCount} non-critical</span>
    </div>`).join('') : `<div class="qcp-emptystate">No agents in the current filters.</div>`;
}

// ---- shared chart helpers (ported from the mock, hand-rolled inline SVG,
// fed real aggregated data instead of a fake generator) ----
function qcpSparkSvg(values,w,h,decimals,invert){
  w=w||64; h=h||20; decimals=decimals===undefined?0:decimals;
  values=(values||[]).filter(v=>v!=null && !isNaN(v));
  if(!values.length) return '';
  const mx=9,padTop=10,plotBottom=h-2;
  const min=Math.min(...values), max=Math.max(...values), range=(max-min)||1;
  const pts=values.map((v,i)=>[ mx+(i/(values.length-1||1))*(w-2*mx), plotBottom-((v-min)/range)*(plotBottom-padTop) ]);
  const path=pts.map(p=>p.join(',')).join(' ');
  const last=pts[pts.length-1], first=pts[0];
  const improved = invert ? last[1]>first[1] : last[1]<first[1];
  const worsened = invert ? last[1]<first[1] : last[1]>first[1];
  const color= improved ? 'var(--qcp-pass)' : worsened ? 'var(--qcp-fail)' : 'var(--qcp-text-3)';
  const labels=pts.map((p,i)=>`<text x="${p[0]}" y="${Math.max(7,p[1]-4)}" text-anchor="middle" font-size="7.5" font-family="var(--qcp-font-m)" font-weight="700" fill="${color}">${values[i].toFixed(decimals)}</text>`).join('');
  return `<svg class="qcp-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${labels}<polyline points="${path}" fill="none" stroke="${color}" stroke-width="1.8"/><circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="${color}"/></svg>`;
}
function qcpChartX(i,n,w0,w1){ return n<=1? (w0+w1)/2 : w0+(i/(n-1))*(w1-w0); }
function qcpWireHover(svg){
  const tip=document.getElementById('qcpChartTip');
  if(!tip) return;

function qcpDrawBarChart(svgId,values,labels,fmt,opts){
  opts=opts||{};
  const svg=document.getElementById(svgId); if(!svg) return;
  const width=opts.width||320; const w0=34,w1=width-12,top=26,bottom=112;
  if(opts.width){ svg.setAttribute('viewBox',`0 0 ${width} 140`); svg.setAttribute('width',width); svg.removeAttribute('style'); }
  const max=Math.max(...values,1);
  let out=`<line class="qcp-gridline" x1="${w0}" y1="${top}" x2="${w0}" y2="${bottom}"/><line class="qcp-gridline" x1="${w0}" y1="${bottom}" x2="${w1}" y2="${bottom}"/>`;
  values.forEach((v,i)=>{
    const cx=qcpChartX(i,values.length,w0+30,w1-30);
    const h=(v/max)*(bottom-top-12); const y=bottom-h;
    out+=`<rect class="qcp-hoverdot" data-tip="${escHtml(labels[i])}: ${fmt(v)}" x="${cx-18}" y="${y}" width="36" height="${h}" rx="4" fill="var(--qcp-accent)" opacity="${0.45+0.55*(i/(values.length-1||1))}"/>`;
    out+=`<text x="${cx}" y="${y-6}" text-anchor="middle" font-size="11" font-family="var(--qcp-font-m)" font-weight="700" fill="var(--qcp-text)">${fmt(v)}</text>`;
    out+=`<text class="qcp-axis-lbl" x="${cx}" y="${bottom+14}" text-anchor="middle">${escHtml(labels[i])}</text>`;
  });
  svg.innerHTML=out; qcpWireHover(svg);
}
function qcpDrawDualLineChart(svgId,seriesA,seriesB,labels,fmt,opts){
  opts=opts||{};

  const max=Math.max(...seriesA,...seriesB,1);

  pb.forEach((p,i)=>{ const y=p[1]<=top+10?p[1]+14:Math.max(10,p[1]-8); out+=`<text x="${p[0]}" y="${y}" text-anchor="middle" font-size="10" font-family="var(--qcp-font-m)" font-weight="700" fill="var(--qcp-warn)">${fmt(seriesB[i])}</text>`; });

function qcpDrawLineChart(svgId,values,labels,fmt,color,opts){

function qcpRenderTrendCharts(){
  const scope=qcpFilteredAudits({ignoreDate:true});
  const months=qcpAllMonthKeys(scope);
  const multiYear=new Set(months.map(k=>k.slice(0,4))).size>1;
  const labels=months.map(mk=>qcpMonthLabel(mk,multiYear));
  const monthly=months.map(mk=>qcpAggregate(scope.filter(a=>qcpMonthKey(a.auditDate)===mk)));
  const vol=monthly.map(m=>m.n);
  const crit=monthly.map(m=>m.n? m.criticalCount/m.n*100:0);
  const doc=monthly.map(m=>m.n? m.bucketCounts.documentation/m.n*100:0);
  const readout=document.getElementById('qcpTrendReadout');
  if(months.length){
    qcpDrawBarChart('qcpVolChart',vol,labels,v=>v.toLocaleString());
    qcpDrawDualLineChart('qcpRateChart',crit,doc,labels,v=>v.toFixed(1)+'%');
    if(readout) readout.textContent=`Volume moved ${vol[0].toLocaleString()} → ${vol[vol.length-1].toLocaleString()} while critical-failure rate moved ${crit[0].toFixed(1)}% → ${crit[crit.length-1].toFixed(1)}% and documentation ${doc[0].toFixed(1)}% → ${doc[doc.length-1].toFixed(1)}% across the current program/team-leader filters.`;
  } else {
    const v=document.getElementById('qcpVolChart'); if(v) v.innerHTML='';
    const r=document.getElementById('qcpRateChart'); if(r) r.innerHTML='';
    if(readout) readout.textContent='No dated audits under the current filters yet.';
  }
}

function qcpSortRows(rows,sortSpec){
  const {key,dir}=sortSpec;
  const s=[...rows].sort((a,b)=>{
    let av=a[key], bv=b[key];
    if(av==null) av = (typeof bv==='number')? -Infinity : '';
    if(bv==null) bv = (typeof av==='number')? -Infinity : '';
    if(av<bv) return -1; if(av>bv) return 1; return 0;
  });
  if(dir==='desc') s.reverse();
  return s;
}
function qcpRosterRows(){
  const dir=qcpDirectory();
  const missLog=qcpMissLog();
  const [from,to]=qcpEffectiveDateRange();
  return dir.agents.filter(e=> _qcp.teamLeaders.has(e.teamLeader) && (e.programs.size===0 || [...e.programs].some(p=>_qcp.programs.has(p))) )
    .map(e=>{
      const all=qcpAudits().filter(a=>a.agent===e.name);
      const rangeAudits=all.filter(a=>qcpInDateRange(a.auditDate));
      const overall=qcpAggregate(rangeAudits);
      const rr=e.rosterRow;
      const teamLabel=qcpTeamForAgentInRange(rr,from,to);
      const att=qcpAttendanceForRange(rr,from,to);
      const cases=qcpCasesForRange(rr,from,to);
      const escalations=qcpEscalationsForAgent(e.name,from,to,missLog);
      return {name:e.name,tl:e.teamLeader,team:teamLabel,workingDays:att.working,leaveDays:att.leave,pctAvailable:att.pct,
        caseCount:cases,escalationCount:escalations,qcScore:overall.health,rosterRow:rr,all,overall};
    });
}
function qcpRenderRoster(){
  const rows=qcpSortRows(qcpRosterRows(),_qcp.rosterSort);
  const arrow=k=>_qcp.rosterSort.key===k?(_qcp.rosterSort.dir==='asc'?'▲':'▼'):'';
  const th=(key,label)=>`<th class="n" onclick="qcpSortRoster('${key}')">${label}${arrow(key)?'<span class="qcp-sort-arrow">'+arrow(key)+'</span>':''}</th>`;
  const body=rows.length? rows.map(r=>`<tr>
      <td><span class="qcp-roster-agent-link" onclick="qcpOpenAgentReport('${qcpEscJs(r.name)}')" title="Open ${escHtml(r.name)}'s full report">${escHtml(r.name)}</span></td>
      <td>${escHtml(r.tl)}</td>
      <td class="n qcp-tabular">${r.workingDays!=null?r.workingDays:'—'}</td>
      <td style="min-width:170px">${escHtml(r.team)}</td>
      <td class="n qcp-tabular">${r.caseCount}</td>
      <td class="n qcp-tabular">${r.escalationCount}</td>
      <td class="n"><span class="qcp-badge ${qcpBand(r.qcScore)}">${r.qcScore!=null?r.qcScore.toFixed(1):'—'}</span></td>
      <td class="n qcp-tabular" style="color:${r.leaveDays?'var(--qcp-warn)':'var(--qcp-text-2)'}">${r.leaveDays!=null?r.leaveDays:'—'}</td>
      <td class="n qcp-tabular">${r.pctAvailable!=null?r.pctAvailable.toFixed(1)+'%':'—'}</td>
    </tr>`).join('') : `<tr><td colspan="9" class="qcp-emptystate">Nothing matches the current filters.</td></tr>`;
  const el=document.getElementById('qcpRosterTable');
  if(!el) return;
  el.innerHTML=`<thead><tr>
      <th onclick="qcpSortRoster('name')">Agent name${arrow('name')?'<span class="qcp-sort-arrow">'+arrow('name')+'</span>':''}</th>
      <th onclick="qcpSortRoster('tl')">Team leader${arrow('tl')?'<span class="qcp-sort-arrow">'+arrow('tl')+'</span>':''}</th>
      ${th('workingDays','Working days')}
      <th style="min-width:170px">Team</th>
      ${th('caseCount','# of Cases')}
      ${th('escalationCount','Escalations')}
      ${th('qcScore','QC score')}
      ${th('leaveDays','Leave')}
      ${th('pctAvailable','Available Days (%)')}
    </tr></thead><tbody>${body}</tbody>`;

function qcpSortRoster(key){ _qcp.rosterSort=_qcp.rosterSort.key===key?{key,dir:_qcp.rosterSort.dir==='asc'?'desc':'asc'}:{key,dir:'asc'}; qcpRenderRoster(); }

function qcpTopFields(audits,limit,byKey){
  const counts={}, byExtra={};
  audits.forEach(a=>{
    const fails=Array.isArray(a.failedFields)?a.failedFields:[];
    fails.forEach(label=>{
      const b=qcpBucketOf(label);
      if(!b) return;
      counts[label]=(counts[label]||0)+1;
      if(byKey){
        const kv= byKey==='teamLeader'? qcpAgentTL(a.agent||'') : (a[byKey]||'(unknown)');
        (byExtra[label]=byExtra[label]||{})[kv]=(byExtra[label][kv]||0)+1;
      }
    });
  });
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([label,count])=>({
    label,count,critical:QC_CRITICAL_ITEM_LABELS.has(label),
    breakdown: byKey? Object.entries(byExtra[label]||{}).sort((a,b)=>b[1]-a[1]) : null
  }));
}
function qcpProgramAgentNames(program){
  return qcpDirectory().agents.filter(e=>e.programs.has(program)).map(e=>e.name);
}
function qcpTeamLeaderAgentNames(tl){
  return qcpDirectory().agents.filter(e=>e.teamLeader===tl).map(e=>e.name);
}
function qcpEntityGroups(){
  const level=_qcp.level;
  const audits=qcpFilteredAudits();
  const dir=qcpDirectory();
  if(level==='program'){
    return dir.programs.filter(p=>_qcp.programs.has(p)).map(p=>({key:p,name:p,subtitle:'',recs:audits.filter(a=>a.program===p)}));
  }
  if(level==='teamLeader'){
    return dir.teamLeaders.filter(t=>_qcp.teamLeaders.has(t)).map(t=>{
      const agentCount=qcpTeamLeaderAgentNames(t).length;
      return {key:t,name:t,subtitle:agentCount+' agent'+(agentCount!==1?'s':''),recs:qcpFilteredAudits({ignoreFocus:true}).filter(a=>qcpAgentTL(a.agent)===t)};
    });
  }
  const names=[...new Set(audits.map(a=>a.agent).filter(Boolean))];
  const [from,to]=qcpEffectiveDateRange();
  const missLog=qcpMissLog();
  return names.map(a=>{
    const arecs=audits.filter(x=>x.agent===a);
    const rr=qcpRosterRowFor(a);
    const att=qcpAttendanceForRange(rr,from,to);
    return {key:a,name:a,subtitle:qcpAgentTL(a),recs:arecs,rangeCases:qcpCasesForRange(rr,from,to),
      workingDays:att.working,leaveDays:att.leave,pctAvailable:att.pct,escalations:qcpEscalationsForAgent(a,from,to,missLog)};
  });
}
function qcpRenderEntitySection(){
  const level=_qcp.level;
  const subEl=document.getElementById('qcpLevelSub');
  if(subEl) subEl.textContent = level==='program'? 'One row per program, current filters.' : level==='teamLeader'? 'Team roll-up, current filters — click a name for the full team report.' : "Every agent's audits across every program they've worked, current filters.";
  const groups=qcpEntityGroups().map(g=>{
    const agg=qcpAggregate(g.recs);
    const scopeAll = level==='program'? qcpAudits().filter(a=>a.program===g.key)
                    : level==='teamLeader'? qcpAudits().filter(a=>qcpAgentTL(a.agent)===g.key)
                    : qcpAudits().filter(a=>a.agent===g.key);
    const months=qcpAllMonthKeys(scopeAll);
    const healthSeries=months.map(mk=>qcpAggregate(scopeAll.filter(a=>qcpMonthKey(a.auditDate)===mk)).health).filter(h=>h!=null);
    const byChildKey = level==='program'? 'teamLeader' : level==='teamLeader'? 'agent':'program';
    const byChild=new Map();
    g.recs.forEach(a=>{
      const k = byChildKey==='teamLeader'? qcpAgentTL(a.agent||'') : (a[byChildKey]||'(unknown)');
      if(!byChild.has(k)) byChild.set(k,[]);
      byChild.get(k).push(a);
    });
    const childLabel=level==='program'?'Team Leader':level==='teamLeader'?'Agent':'Program';
    const children=[...byChild.entries()].map(([name,rs])=>({name,agg:qcpAggregate(rs)}));
    return {...g,agg,healthSeries,children,childLabel,top:qcpTopFields(g.recs,5)};
  });
  const [from,to]=qcpEffectiveDateRange();
  const missLog=qcpMissLog();
  if(level==='teamLeader' || level==='program'){
    groups.forEach(g=>{
      const memberNames = level==='teamLeader'? qcpTeamLeaderAgentNames(g.key) : qcpProgramAgentNames(g.key);
      let cases=0;
      memberNames.forEach(n=>{ cases+=qcpCasesForRange(qcpRosterRowFor(n),from,to); });
      g.caseCount=cases;
      g.escalationCount=qcpEscalationsForAgents(memberNames,from,to,missLog);
    });
  }
  const flagged=qcpRepeatFlaggedAgents(qcpFilteredAudits({ignoreDate:true}));
  if(_qcp.view==='cards') qcpRenderEntityCards(groups,flagged,level); else qcpRenderEntityTable(groups,flagged,level);
  qcpRenderCleanStrip();
  const cleanWrap=document.getElementById('qcpCleanStripWrap'); if(cleanWrap) cleanWrap.hidden = level!=='agent';

  const singleAgent = level==='agent' && _qcp.focus && _qcp.focus.type==='agent' ? _qcp.focus.name : null;
  const caseWrap=document.getElementById('qcpCaseByCaseWrap');
  const weeklyWrap=document.getElementById('qcpWeeklyWrap');
  if(singleAgent){
    const all=qcpAudits().filter(a=>a.agent===singleAgent);
    document.getElementById('qcpCaseByCaseTitle').textContent=`Case by case (${all.length})`;
    document.getElementById('qcpCaseByCase').innerHTML=qcpCaseByCaseTableHtml(all);
    caseWrap.hidden=false;
    qcpRenderWeeklySet('qcpWeekly',all,[singleAgent]);
    weeklyWrap.hidden=false;
  } else {
    if(caseWrap) caseWrap.hidden=true;
    if(weeklyWrap) weeklyWrap.hidden=true;
  }
}
function qcpRenderCleanStrip(){
  const audits=qcpFilteredAudits();
  const byAgent=new Map();
  audits.forEach(a=>{ const n=a.agent; if(!n) return; if(!byAgent.has(n)) byAgent.set(n,[]); byAgent.get(n).push(a); });
  const clean=[...byAgent.entries()].map(([a,rs])=>({agent:a,n:rs.length,agg:qcpAggregate(rs)})).filter(x=>x.agg.criticalCount===0 && x.agg.nonCriticalCount===0).sort((a,b)=>b.n-a.n);
  const el=document.getElementById('qcpCleanStrip');
  if(!el) return;
  el.innerHTML=`<div class="qcp-clean-head"><span style="font-size:15px">&#127942;</span><h3>Fully clean, current filters</h3></div>
    <div class="qcp-clean-names">${clean.length? clean.map(c=>`<span class="qcp-clean-chip">${escHtml(c.agent)} <span class="qcp-n">· ${c.n} audits</span></span>`).join('') : '<span style="color:var(--qcp-text-3);font-size:12.5px">No agent is fully clean under the current filters.</span>'}</div>`;
}

function qcpHeatColor(rate){
  if(rate>0.12) return {bg:'var(--qcp-fail)',ink:'#fff'};
  if(rate>0.06) return {bg:'var(--qcp-warn)',ink:'#fff'};
  if(rate>0.02) return {bg:'var(--qcp-warn-bg)',ink:'var(--qcp-warn)'};
  return {bg:'var(--qcp-pass-bg)',ink:'var(--qcp-pass)'};
}
function qcpRenderHeatmap(){
  const recs=qcpFilteredAudits();
  const dir=qcpDirectory();
  const programs=dir.programs.filter(p=>_qcp.programs.has(p));
  const grid=document.getElementById('qcpHeatGrid');
  if(!grid) return;
  grid.style.gridTemplateColumns=`160px repeat(${QCP_BUCKETS.length},1fr)`;
  let html=`<div class="qcp-heat-cell hdr">Program</div>`+QCP_BUCKETS.map(b=>`<div class="qcp-heat-cell hdr">${QCP_BUCKET_LABEL[b]}</div>`).join('');
  programs.forEach(p=>{
    const progRecs=recs.filter(r=>r.program===p);
    html+=`<div class="qcp-heat-cell rowhdr">${escHtml(p)} <span style="color:var(--qcp-text-3);font-weight:400">(${progRecs.length})</span></div>`;
    QCP_BUCKETS.forEach(bucket=>{
      const count=progRecs.filter(r=>(r.failedFields||[]).some(l=>qcpBucketOf(l)===bucket)).length;
      const rate=progRecs.length? count/progRecs.length:0;
      const col=qcpHeatColor(rate);
      const sel=_qcpHeatSel && _qcpHeatSel.program===p && _qcpHeatSel.bucket===bucket;
      html+=`<div class="qcp-heat-cell ${sel?'sel':''}" style="background:${col.bg};color:${col.ink}" onclick="qcpSelectHeat('${qcpEscJs(p)}','${bucket}')">${(rate*100).toFixed(1)}% <span style="font-weight:500;opacity:.75">(${count})</span></div>`;
    });
  });
  grid.innerHTML=html;
  if(_qcpHeatSel) qcpRenderHeatDetail(); else document.getElementById('qcpHeatmapDetail').hidden=true;
}
function qcpSelectHeat(program,bucket){
  _qcpHeatSel=(_qcpHeatSel && _qcpHeatSel.program===program && _qcpHeatSel.bucket===bucket) ? null : {program,bucket};
  qcpRenderHeatmap();
}
function qcpRenderHeatDetail(){
  const {program,bucket}=_qcpHeatSel;
  const recs=qcpFilteredAudits().filter(r=>r.program===program && (r.failedFields||[]).some(l=>qcpBucketOf(l)===bucket));
  const counts={}; recs.forEach(r=>(r.failedFields||[]).forEach(l=>{ if(qcpBucketOf(l)===bucket) counts[l]=(counts[l]||0)+1; }));
  const rows=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const box=document.getElementById('qcpHeatmapDetail');
  box.hidden=false;
  box.innerHTML=`<div class="qcp-card qcp-heatmap-detail"><div class="qcp-hd-title">${escHtml(program)} · ${QCP_BUCKET_LABEL[bucket]} — top failed items${bucket==='critical'?" (with today's deduction %)":''}</div>
    ${rows.length? rows.map(([label,n])=>{
      let ded='';
      if(bucket==='critical'){
        const g=QC_DEDUCTION_GROUPS.find(gr=>gr.labels&&gr.labels.includes(label));
        if(g && g.pct!=null) ded=` <span style="color:var(--qcp-text-3)">— ${g.pct}%</span>`;
      }
      return `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--qcp-border);font-size:12.5px"><span>${escHtml(label)}${ded}</span><span class="qcp-tabular" style="font-family:var(--qcp-font-m);font-weight:700">${n}</span></div>`;
    }).join('') : '<div style="color:var(--qcp-text-3);font-size:12.5px">No failures for this combination in the current filters.</div>'}</div>`;
}

// ══════════════════════════════════════════════════════════════
//  week-on-week (real ISO-week buckets from actual audit/roster dates —
//  simplified from the mock's fixed month+quarter dual charts to a single
//  "last available weeks" trend, since real data has no fixed quarter)
// ══════════════════════════════════════════════════════════════
function qcpWeeklyRows(audits,agentNames){
  const roster=qcpRoster();
  const byWeek=new Map();
  audits.forEach(a=>{
    if(!a.auditDate) return;
    const wk=qcpIsoWeekKey(a.auditDate);
    if(!wk) return;
    if(!byWeek.has(wk)) byWeek.set(wk,[]);
    byWeek.get(wk).push(a);
  });
  const weeks=[...byWeek.keys()].sort().slice(-10);
  return weeks.map(wk=>{
    const list=byWeek.get(wk);
    const agg=qcpAggregate(list);
    let cases=0;
    agentNames.forEach(n=>{ cases+=qcpCasesByWeek(qcpRosterRowFor(n),wk); });
    return {label:wk.replace(/^\d{4}-/,''),n:list.length,cases,critical:agg.criticalCount,nonCritical:agg.nonCriticalCount,health:agg.health};
  });
}
function qcpRenderWeeklySet(prefix,audits,agentNames){
  const rows=qcpWeeklyRows(audits,agentNames);
  const width=Math.max(320,rows.length*46);
  const labels=rows.map(r=>r.label);
  if(!rows.length){
    [prefix+'CasesChart',prefix+'QcChart',prefix+'ErrChart'].forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML=''; });
    return;
  }
  qcpDrawBarChart(prefix+'CasesChart',rows.map(r=>r.cases),labels,v=>v.toLocaleString(),{width});
  qcpDrawLineChart(prefix+'QcChart',rows.map(r=>r.health!=null?r.health:0),labels,v=>v.toFixed(1),'var(--qcp-accent)',{width});
  qcpDrawDualLineChart(prefix+'ErrChart',rows.map(r=>r.critical),rows.map(r=>r.nonCritical),labels,v=>v.toLocaleString(),{width});
}

// ══════════════════════════════════════════════════════════════
//  Repeat-pattern detail modal
// ══════════════════════════════════════════════════════════════
function qcpRepeatingCriticalDetails(agentName){
  const audits=qcpAudits().filter(a=>a.agent===agentName);
  const byMonth=new Map();
  audits.forEach(a=>{ const mk=qcpMonthKey(a.auditDate); if(!mk) return; if(!byMonth.has(mk)) byMonth.set(mk,[]); byMonth.get(mk).push(a); });
  const labelOccurrences=new Map();
  byMonth.forEach((recs1,mk)=>{
    const nextKey=qcpNextMonthKey(mk);
    if(!byMonth.has(nextKey)) return;
    const recs2=byMonth.get(nextKey);
    const labelsIn=(recs)=>{ const m=new Map(); recs.forEach(a=>(a.failedFields||[]).forEach(l=>{ if(!QC_CRITICAL_ITEM_LABELS.has(l)) return; if(!m.has(l)) m.set(l,[]); m.get(l).push(a); })); return m; };
    const m1=labelsIn(recs1), m2=labelsIn(recs2);
    m1.forEach((list1,label)=>{
      if(!m2.has(label)) return;
      if(!labelOccurrences.has(label)) labelOccurrences.set(label,new Map());
      const store=labelOccurrences.get(label);
      [[mk,list1],[nextKey,m2.get(label)]].forEach(([monthKey,list])=>{
        if(!store.has(monthKey)) store.set(monthKey,[]);
        const existing=store.get(monthKey);
        list.forEach(a=>{ if(!existing.some(x=>x.auditId===a.auditId)) existing.push(a); });
      });
    });
  });
  const multiYear=new Set([...byMonth.keys()].map(k=>k.slice(0,4))).size>1;
  const results=[];
  labelOccurrences.forEach((monthMap,label)=>{
    const byMonthCases=[...monthMap.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([mk,list])=>({month:qcpMonthLabel(mk,multiYear),cases:list.map(a=>({caseId:a.srNumber||a.auditId,program:a.program,date:a.auditDate}))}));
    const allCases=byMonthCases.flatMap(x=>x.cases);
    const programs=[...new Set(allCases.map(c=>c.program).filter(Boolean))];
    results.push({label,byMonthCases,programs,total:allCases.length});
  });
  return results.sort((a,b)=>b.total-a.total);
}

function qcpDayHeatmapHtml(audits,agentNames){
  const monthSet=new Set();
  audits.forEach(a=>{ if(a.auditDate) monthSet.add(a.auditDate.slice(0,7)); });
  const roster=qcpRoster();
  const rosterRows=agentNames.map(n=>qcpRosterRowFor(n)).filter(Boolean);
  rosterRows.forEach(rr=>{ (rr.daily||[]).forEach(d=>{ if(d.date) monthSet.add(d.date.slice(0,7)); }); });
  const months=[...monthSet].sort();
  if(!months.length) return '<div class="qcp-qa-empty">No data.</div>';
  const byDate=new Map();
  audits.forEach(a=>{ if(!a.auditDate) return; if(!byDate.has(a.auditDate)) byDate.set(a.auditDate,[]); byDate.get(a.auditDate).push(a); });
  const casesByDate=new Map();
  rosterRows.forEach(rr=>{ (rr.daily||[]).forEach(d=>{ if(!d.date||typeof d.counts!=='number') return; casesByDate.set(d.date,(casesByDate.get(d.date)||0)+d.counts); }); });
  const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let rowsHtml='';
  months.forEach(mk=>{
    const parts=mk.split('-'); const y=parseInt(parts[0],10), m=parseInt(parts[1],10);
    const daysInMonth=new Date(y,m,0).getDate();
    const monthName=monthNames[m-1];
    let cells='';
    for(let d=1; d<=daysInMonth; d++){
      const iso=mk+'-'+String(d).padStart(2,'0');
      const recs=byDate.get(iso)||[];
      const cases=casesByDate.get(iso)||0;
      let bg='var(--qcp-surface-3)', ink='var(--qcp-text-3)', mixMark=false;
      let title=`${monthName} ${d}: ${cases} case${cases!==1?'s':''} · no audits`;
      if(recs.length){
        const agg=qcpAggregate(recs);
        mixMark=!!(agg.criticalCount && agg.nonCriticalAuditCount);
        bg = agg.criticalCount? 'var(--qcp-fail)' : agg.nonCriticalAuditCount? 'var(--qcp-warn)' : 'var(--qcp-pass)';
        ink='#fff';
        title=`${monthName} ${d}: ${cases} case${cases!==1?'s':''} · ${recs.length} audit${recs.length!==1?'s':''} · ${agg.criticalCount} critical · ${agg.nonCriticalAuditCount} non-critical`;
      }
      cells+=`<div class="qcp-dayheat-daycol"><div class="qcp-dayheat-cell" style="background:${bg};color:${ink}" title="${escHtml(title)}">${cases||''}${mixMark?'<span class="qcp-dayheat-mixmark"></span>':''}</div><span class="qcp-dayheat-daynum">${d}</span></div>`;
    }
    rowsHtml+=`<div class="qcp-dayheat-row"><span class="qcp-mlabel">${monthName}</span><div class="qcp-dayheat-cells">${cells}</div></div>`;
  });
  return `<div class="qcp-dayheat-wrap">${rowsHtml}</div>`;
}

/* ---------------- Coaching Queue ----------------
 * Flags agents from real QC Analytics data (no new data source) and, for
 * each one, shows their case-level rows from the Miss Log — a separate,
 * pre-existing spreadsheet QC reviewers already log misses into — so a
 * coach can fill in Next Action / Issue Resolved without leaving this page.
 * Reads/writes go through the same QC_WEBHOOK_URL and Google Sign-In as
 * the QC Scorecard/Analytics; see Code.gs's handleMissLogList/Update.
 *
 * "Escalations" here means critical-item fails (QC_CRITICAL_ITEM_LABELS,
 * declared further down this file) — not a documentation/communication
 * split, since that taxonomy doesn't exist in this app yet. Case count and
 * QC score are evaluated for the CURRENT calendar month (not all history —
 * a coaching queue should surface what's happening now, not resurface a
 * bad month from last quarter forever); the escalation count is evaluated
 * over the trailing 30 days, matching how it was specified.
 */
// Case-count thresholds are workflow-specific (PBM runs a higher-volume
// caseload than MM); the QC-score and escalation-count thresholds are the
// same for both kinds.
const QC_COACHING_CASE_THRESHOLDS={mm:{attention:8,escalate:6},pbm:{attention:18,escalate:15}};
const QC_COACHING_SCORE_ATTENTION=95,QC_COACHING_SCORE_ESCALATE=90;
const QC_COACHING_ESCALATIONS_ATTENTION=5,QC_COACHING_ESCALATIONS_ESCALATE=10;

let _coachingKind='mm';
let _coachingCache={mm:null,pbm:null};
let _missLogCache=null;

function showCoachingQueue(){
  currentView='coaching_queue';currentProgId='';
  document.querySelectorAll(".sidebar-item").forEach(el=>el.classList.remove("active"));
  document.querySelectorAll(".sidebar-nav-item").forEach(el=>el.classList.remove("active"));
  qcExpandNavGroup();
  const n=document.getElementById('navCoachingQueue');if(n)n.classList.add('active');
  document.getElementById('main').innerHTML=renderCoachingQueueShell();
  qcLoadCoachingQueue(_coachingKind);
}

function renderCoachingQueueShell(){
  return `<div class="qc-header">
    <div class="qc-header-top">
      <div>
        <div class="qc-title">&#129517; Coaching Queue</div>
        <div class="qc-subtitle">Agents flagged from real QC Analytics data — the worst of the last 3 months' case count and QC score, plus real Miss Log escalations in the last 30 days — with the Miss Log's case-level history alongside so a coach can close the loop here.</div>
      </div>
      <div class="qc-toolbar">
        <button class="qc-btn" onclick="qcRefreshCoachingQueue()">&#9851; Refresh</button>
      </div>
    </div>
    <div class="tabs" style="margin-top:14px">
      <div class="tab ${_coachingKind==='mm'?'active-mm':''}" onclick="qcSwitchCoachingKind('mm')">MM</div>
      <div class="tab ${_coachingKind==='pbm'?'active-pbm':''}" onclick="qcSwitchCoachingKind('pbm')">PBM</div>
    </div>
  </div>
  <div id="coachingQueueBody"><div style="padding:40px;text-align:center;color:#94a3b8">Loading…</div></div>`;
}

function qcSwitchCoachingKind(kind){
  _coachingKind=kind;
  document.getElementById('main').innerHTML=renderCoachingQueueShell();
  qcLoadCoachingQueue(kind);
}

function qcRefreshCoachingQueue(){
  _coachingCache[_coachingKind]=null;
  _missLogCache=null;
  qcLoadCoachingQueue(_coachingKind);
}

async function qcLoadCoachingQueue(kind){
  const bodyEl=document.getElementById('coachingQueueBody');
  if(!bodyEl)return;
  if(!qcWebhookConfigured()){
    bodyEl.innerHTML=`<div style="padding:40px;text-align:center;color:#94a3b8">&#9888; Save endpoint not configured yet — see google-apps-script/Code.gs</div>`;
    return;
  }
  if(!qcAuthConfigured()){
    bodyEl.innerHTML=`<div style="padding:40px;text-align:center;color:#94a3b8">&#9888; Google Sign-In not configured yet — see google-apps-script/Code.gs</div>`;
    return;
  }
  if(!qcIsSignedIn()){
    bodyEl.innerHTML=`<div style="padding:40px;text-align:center;color:#94a3b8">&#9888; Please sign in with your Google account (top right) to view the coaching queue.</div>`;
    if(typeof google!=='undefined'&&google.accounts) google.accounts.id.prompt();
    return;
  }
  bodyEl.innerHTML=`<div style="padding:40px;text-align:center;color:#94a3b8">Loading…</div>`;
  const FRESH_MS=5*60*1000;
  try{
    const cachedAudits=_coachingCache[kind];
    const auditsPromise=(cachedAudits&&(Date.now()-cachedAudits.ts)<FRESH_MS)
      ? Promise.resolve(cachedAudits.data)
      : fetch(QC_WEBHOOK_URL,{method:'POST',body:JSON.stringify({action:'list',kind,idToken:qcAuthToken})})
          .then(res=>res.json())
          .then(data=>{
            if(data.status!=='ok')throw new Error(data.message||'Unknown error loading audits');
            _coachingCache[kind]={data:data.audits,ts:Date.now()};
            return data.audits;
          });
    const missLogPromise=(_missLogCache&&(Date.now()-_missLogCache.ts)<FRESH_MS)
      ? Promise.resolve(_missLogCache.data)
      : fetch(QC_WEBHOOK_URL,{method:'POST',body:JSON.stringify({action:'missLogList',idToken:qcAuthToken})})
          .then(res=>res.json())
          .then(data=>{
            if(data.status!=='ok')throw new Error(data.message||'Unknown error loading the Miss Log');
            _missLogCache={data:data.rows,ts:Date.now()};
            return data.rows;
          });
    // The audit list and the Miss Log are two independent sheets — fire
    // both requests at once instead of awaiting them one after another,
    // which would otherwise roughly double the wait on a cold cache.
    const [audits,missLogRows]=await Promise.all([auditsPromise,missLogPromise]);
    bodyEl.innerHTML=renderCoachingQueueBody(kind,audits,missLogRows);
  }catch(err){
    bodyEl.innerHTML=`<div style="padding:40px;text-align:center;color:#dc2626">&#10005; Could not load coaching queue: ${escHtml(err.message)}</div>`;
  }
}

// One row in, one flag summary out per agent — only agents who already
// have at least one real audit for this kind can be evaluated (there's no
// per-kind roster to cross-reference against), so an agent with zero
// audits ever for this kind simply won't appear here rather than being
// wrongly flagged as "0 cases".
//
// Matches the mock's coaching-flag design (qc_pulse_mockup.html): the worst
// of the last 3 calendar months drives the badge — one bad month is enough
// to flag the agent, not just whatever the current month looks like — and
// "escalations in the last 30 days" means real Miss Log rows for that agent
// (any reason, per this app's own escalations definition), not critical
// QC-item fails, which is what this used to check before the Miss Log was
// wired up as the real escalations source.
function qcCoachingComputeFlags(audits,kind,missLogRows){
  missLogRows=missLogRows||[];
  const now=new Date();now.setHours(0,0,0,0);
  const from30=new Date(now);from30.setDate(from30.getDate()-29);
  const monthKeys=[];
  for(let i=0;i<3;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    monthKeys.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  const monthLabel=key=>{
    const [y,m]=key.split('-').map(Number);
    return new Date(y,m-1,1).toLocaleString('en-US',{month:'short'});
  };
  const byAgent={};
  audits.forEach(a=>{
    const agent=(a.agent||'').trim();
    if(!agent)return;
    if(!byAgent[agent])byAgent[agent]={agent,teamLeaders:new Set(),months:{}};
    const g=byAgent[agent];
    if(a.teamLeader)g.teamLeaders.add(a.teamLeader);
    if(!a.auditDate)return;
    const d=new Date(a.auditDate+'T00:00:00');
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(monthKeys.indexOf(key)===-1)return;
    if(!g.months[key])g.months[key]={count:0,scoreSum:0,scoreCount:0};
    g.months[key].count++;
    const score=parseFloat(a.overallScore);
    if(!isNaN(score)){g.months[key].scoreSum+=score;g.months[key].scoreCount++;}
  });
  const escByAgent30d={};
  missLogRows.forEach(r=>{
    const agent=(r.agent||'').trim();
    if(!agent||!r.callDate)return;
    const d=new Date(r.callDate+'T00:00:00');
    if(d>=from30&&d<=now) escByAgent30d[agent]=(escByAgent30d[agent]||0)+1;
  });
  const t=QC_COACHING_CASE_THRESHOLDS[kind];
  return Object.values(byAgent).map(g=>{
    let level='clean';
    const reasons=[];
    monthKeys.forEach((key,i)=>{
      const m=g.months[key];
      // A month with zero real audits is only meaningful for the CURRENT
      // month (a live low-cases signal) — a past month with no rows at all
      // just means data doesn't reach that far back yet, not a miss.
      if(!m&&i>0)return;
      const count=m?m.count:0;
      const avgScore=m&&m.scoreCount?Math.round(m.scoreSum/m.scoreCount):null;
      let monthLevel='clean';
      const monthReasons=[];
      if(count<t.escalate){monthReasons.push(count+' cases < '+t.escalate);monthLevel='escalate';}
      else if(count<t.attention){monthReasons.push(count+' cases < '+t.attention);monthLevel='attention';}
      if(avgScore!==null){
        if(avgScore<QC_COACHING_SCORE_ESCALATE){monthReasons.push('QC score '+avgScore+'% < '+QC_COACHING_SCORE_ESCALATE+'%');monthLevel='escalate';}
        else if(avgScore<QC_COACHING_SCORE_ATTENTION&&monthLevel!=='escalate'){monthReasons.push('QC score '+avgScore+'% < '+QC_COACHING_SCORE_ATTENTION+'%');monthLevel='attention';}
      }
      if(monthLevel!=='clean'){
        reasons.push(monthLabel(key)+': '+monthReasons.join(', '));
        if(monthLevel==='escalate')level='escalate'; else if(level!=='escalate')level='attention';
      }
    });
    const escalations30d=escByAgent30d[g.agent]||0;
    if(escalations30d>QC_COACHING_ESCALATIONS_ESCALATE){reasons.push('Last 30d: '+escalations30d+' escalations > '+QC_COACHING_ESCALATIONS_ESCALATE);level='escalate';}
    else if(escalations30d>QC_COACHING_ESCALATIONS_ATTENTION){reasons.push('Last 30d: '+escalations30d+' escalations > '+QC_COACHING_ESCALATIONS_ATTENTION);if(level!=='escalate')level='attention';}
    const thisMonth=g.months[monthKeys[0]];
    return {
      agent:g.agent,
      teamLeader:[...g.teamLeaders].join(', ')||'—',
      thisMonthCount:thisMonth?thisMonth.count:0,
      avgScore:thisMonth&&thisMonth.scoreCount?Math.round(thisMonth.scoreSum/thisMonth.scoreCount):null,
      escalations30d,
      level,reasons
    };
  }).filter(x=>x.level!=='clean').sort((a,b)=>a.level!==b.level?(a.level==='escalate'?-1:1):a.agent.localeCompare(b.agent));
}

function renderCoachingQueueBody(kind,audits,missLogRows){
  const flagged=qcCoachingComputeFlags(audits,kind,missLogRows);
  const escalateCount=flagged.filter(f=>f.level==='escalate').length;
  const attentionCount=flagged.length-escalateCount;
  const missByAgent={};
  missLogRows.forEach(r=>{
    const key=(r.agent||'').trim().toLowerCase();
    if(!key)return;
    (missByAgent[key]=missByAgent[key]||[]).push(r);
  });
  const summary=`<div class="qc-score-strip">
    <div class="qc-score-big"><div class="qc-score-num na">${flagged.length}</div><div class="qc-score-caption">Total Flagged</div></div>
    <div class="qc-score-divider"></div>
    <div class="qc-score-big"><div class="qc-score-num fail">${escalateCount}</div><div class="qc-score-caption">Escalate</div></div>
    <div class="qc-score-divider"></div>
    <div class="qc-score-big"><div class="qc-score-num warn">${attentionCount}</div><div class="qc-score-caption">Needs Attention</div></div>
  </div>`;
  if(!flagged.length){
    return `${summary}<div style="padding:30px;text-align:center;color:#15803d;font-weight:600">&#10003; No agents currently flagged for ${QC_KIND_META[kind].shortLabel}.</div>`;
  }
  const rows=flagged.map(f=>qcCoachingAgentCardHtml(f,missByAgent[f.agent.trim().toLowerCase()]||[])).join('');
  return `${summary}<div class="section-body">${rows}</div>`;
}

function qcCoachingAgentCardHtml(f,rows){
  const badgeColor=f.level==='escalate'?'#dc2626':'#b45309';
  const badgeBg=f.level==='escalate'?'#fef2f2':'#fffaeb';
  const badgeLabel=f.level==='escalate'?('Escalate to '+escHtml(f.teamLeader)):'Needs Attention';
  const rowsHtml=rows.length?rows.map(qcCoachingMissRowHtml).join(''):`<div style="padding:14px 16px;color:#94a3b8;font-size:12.5px">No Miss Log entries yet for this agent.</div>`;
  return `<div style="border:1px solid #e2e6f0;border-radius:10px;margin-bottom:14px;overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#f8faff;flex-wrap:wrap;gap:10px">
      <div>
        <div style="font-weight:700;font-size:14px">${escHtml(f.agent)} <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:${badgeBg};color:${badgeColor};margin-left:6px">${badgeLabel}</span></div>
        <div style="font-size:12px;color:#64748b;margin-top:2px">Team Leader: ${escHtml(f.teamLeader)}</div>
      </div>
      <div style="display:flex;gap:18px;font-size:12px;color:#374151">
        <div style="text-align:center"><div style="font-weight:700;font-size:15px">${f.thisMonthCount}</div><div style="color:#94a3b8">Cases (mo.)</div></div>
        <div style="text-align:center"><div style="font-weight:700;font-size:15px">${f.avgScore===null?'—':f.avgScore+'%'}</div><div style="color:#94a3b8">QC Score (mo.)</div></div>
        <div style="text-align:center"><div style="font-weight:700;font-size:15px">${f.escalations30d}</div><div style="color:#94a3b8">Escalations (30d)</div></div>
      </div>
    </div>
    <div style="padding:8px 16px;font-size:11.5px;color:#64748b;border-bottom:1px solid #eef1ff">${escHtml(f.reasons.join(' · '))}</div>
    ${rowsHtml}
  </div>`;
}

function qcCoachingMissRowHtml(r){
  const rn=r.rowNumber;
  const resolved=String(r.issueResolved||'').toLowerCase();
  const resolvedChecked=(resolved==='yes'||resolved==='true')?'checked':'';
  const sevColor=r.severity==='High'?'#dc2626':r.severity==='Medium'?'#b45309':'#374151';
  return `<div style="padding:12px 16px;border-top:1px solid #eef1ff" id="missRow_${rn}">

function qcCoachingCaseIdForRow(rowNumber){
  const rows=(_missLogCache&&_missLogCache.data)||[];
  const row=rows.find(r=>r.rowNumber===rowNumber);
  return row?row.caseId:null;
}

function qcCoachingUpdateLocalRow(rowNumber,patch){
  if(!_missLogCache)return;
  const row=_missLogCache.data.find(r=>r.rowNumber===rowNumber);
  if(row)Object.assign(row,patch);
}

// Both saves require their own entry AND a date — an empty next action or
// a resolved checkbox with no date isn't something the sheet should record,
// so the save is blocked client-side before it ever reaches Code.gs.
async function qcCoachingSaveNextAction(rowNumber){
  const naEl=document.getElementById('missNA_'+rowNumber);
  const dateEl=document.getElementById('missNADate_'+rowNumber);
  const msgEl=document.getElementById('missMsg_'+rowNumber);
  const text=naEl.value.trim(),date=dateEl.value;
  if(!text||!date){msgEl.style.color='#dc2626';msgEl.textContent='Enter a next action and a date before saving.';return;}
  msgEl.style.color='#64748b';msgEl.textContent='Saving…';
  try{
    const caseId=qcCoachingCaseIdForRow(rowNumber);
    const res=await fetch(QC_WEBHOOK_URL,{method:'POST',body:JSON.stringify({action:'missLogUpdate',idToken:qcAuthToken,rowNumber,caseId,nextAction:text,nextActionDate:date})});
    const data=await res.json();
    if(data.status!=='ok')throw new Error(data.message||'Unknown error');
    msgEl.style.color='#15803d';msgEl.textContent='Saved ✓';
    qcCoachingUpdateLocalRow(rowNumber,{nextAction:text,nextActionDate:date});
  }catch(err){
    msgEl.style.color='#dc2626';msgEl.textContent='Could not save: '+err.message;
  }
}

async function qcCoachingSaveIssueResolved(rowNumber){
  const checkEl=document.getElementById('missIR_'+rowNumber);
  const dateEl=document.getElementById('missIRDate_'+rowNumber);
  const msgEl=document.getElementById('missMsg_'+rowNumber);
  const resolved=checkEl.checked,date=dateEl.value;
  if(!resolved||!date){msgEl.style.color='#dc2626';msgEl.textContent='Check Issue Resolved and set a date before saving.';return;}
  msgEl.style.color='#64748b';msgEl.textContent='Saving…';
  try{
    const caseId=qcCoachingCaseIdForRow(rowNumber);
    const res=await fetch(QC_WEBHOOK_URL,{method:'POST',body:JSON.stringify({action:'missLogUpdate',idToken:qcAuthToken,rowNumber,caseId,issueResolved:'Yes',issueResolvedDate:date})});
    const data=await res.json();
    if(data.status!=='ok')throw new Error(data.message||'Unknown error');
    msgEl.style.color='#15803d';msgEl.textContent='Saved ✓';
    qcCoachingUpdateLocalRow(rowNumber,{issueResolved:'Yes',issueResolvedDate:date});
  }catch(err){
    msgEl.style.color='#dc2626';msgEl.textContent='Could not save: '+err.message;
  }
}

function qcFormatPoints(n){
  const r=Math.round(n*10)/10;
  return Number.isInteger(r)?String(r):r.toFixed(1);
}

function qcSectionBand(pct){
  if(pct>=90) return {label:'High',cls:'high'};
  if(pct>=70) return {label:'Medium',cls:'medium'};
  if(pct>=50) return {label:'Low',cls:'low'};
  return {label:'Fail',cls:'fail'};
}

// Certain named "critical" items are scored (Pass/Fail/N/A, shown in the
// UI like any other row) but excluded entirely from normal per-section
// weighted scoring — passing or failing one costs zero points through the
// ordinary mechanism. Their only effect on the score is the flat deduction
// below, applied straight to the clean total from every other item, so a
// critical failure never double-costs (once via its own weight, again via
// the deduction).
const QC_CRITICAL_ITEM_LABELS=new Set(['Data Fabrication','HIPAA Verification','Opening Statement','Human Call Required','Data Manipulation','Case Disposition','Representation Protocol','Program Specific Pushback']);
// The other two real, mutually-exclusive buckets QC Pulse (QC Analytics)
// uses alongside QC_CRITICAL_ITEM_LABELS above — confirmed to exactly match
// real item labels in QC_SECTIONS_MM/QC_SECTIONS_PBM.
const QC_DOCUMENTATION_ITEM_LABELS=new Set(['Case Record Updates','SR / Case Summary Notes','FUN Quality','Closing Statement']);
const QC_COMMUNICATION_ITEM_LABELS=new Set(['White Glove Service','Demonstrated Expertise']);

// Groups are checked worst-first (100 → 50 → 30 → 5); within a group, EVERY
// failed item applies that group's percentage as its own separate
// multiplicative hit — two 30%-group items both failing is two ×0.7
// multiplications (≈49% of the original), not one. Order across groups
// doesn't change the final number (multiplication commutes) but keeps the
// banner's trail readable worst-first.
const QC_DEDUCTION_GROUPS=[
  {pct:100,labels:['Data Fabrication','HIPAA Verification','Opening Statement','Human Call Required']},
  {pct:50,labels:['Data Manipulation']},
  {pct:30,labels:['Case Disposition','Representation Protocol']},
  {pct:5,labels:['Program Specific Pushback']},
];
function qcItemFailedByLabel(label){
  for(let si=0;si<QC_SECTIONS.length;si++){
    const items=QC_SECTIONS[si].items;
    for(let ii=0;ii<items.length;ii++){
      if(items[ii].label===label){
        const st=qcState.scores[si+'_'+ii];
        return !!(st&&(st.asked==='fail'||st.documented==='fail'));
      }
    }
  }
  return false;
}

function qcRecalc(){
  // Two-level scoring: each section computes its own 0-100% sub-score first
  // (item weights 1/2/4 rank importance *within* that section, N/A excluded,
  // same math as before) — then the Overall Score is the weighted average of
  // every section's sub-score, weighted by that section's fixed weightPct.
  // A section with no scored (non-N/A) items yet is skipped and the other
  // sections' percentages are proportionally rescaled, so the score stays
  // meaningful mid-audit instead of only once everything is filled in.
  let errCount=0,scoredCount=0,totalCount=0,fatalFail=false;
  let weightedNum=0,weightedDenPct=0;
  QC_SECTIONS.forEach((sec,si)=>{
    let secNum=0,secDen=0;
    sec.items.forEach((it,ii)=>{
      totalCount+=2; // asked + documented
      const st=qcState.scores[si+'_'+ii];
      const half=it.w*0.5;
      // Critical items still show/score normally in the UI (and still count
      // toward "# of Errors" / progress) but never touch secNum/secDen —
      // they cost nothing through ordinary weighting, only through the flat
      // deduction below.
      const excluded=QC_CRITICAL_ITEM_LABELS.has(it.label);
      ['asked','documented'].forEach(axis=>{
        const sc=st&&st[axis];
        if(sc==='pass'){if(!excluded){secNum+=half;secDen+=half;}scoredCount++;}
        else if(sc==='fail'){if(!excluded){secDen+=half;}errCount++;scoredCount++;if(it.fatal)fatalFail=true;}
        else if(sc==='na'){scoredCount++;}
      });
    });
    const scoreEl=document.getElementById('qcSecScore_'+si);
    const labelEl=document.getElementById('qcSecLabel_'+si);
    if(secDen>0){
      const secPct=secNum/secDen*100;
      const w=sec.weightPct||0;
      weightedNum+=secPct*w;
      weightedDenPct+=w;
      if(scoreEl) scoreEl.textContent=qcFormatPoints(secNum)+'/'+qcFormatPoints(secDen);
      if(labelEl){
        const band=qcSectionBand(secPct);
        labelEl.textContent=band.label;
        labelEl.className='qc-section-label '+band.cls;
      }
    } else {
      if(scoreEl) scoreEl.textContent='—/—';
      if(labelEl){ labelEl.textContent=''; labelEl.className='qc-section-label'; }
    }
  });
  const rawPct=weightedDenPct>0?Math.min(100,Math.max(0,Math.round(weightedNum/weightedDenPct))):null;

  // Every individual failed critical item applies its own group's percentage
  // as a separate multiplicative hit on the clean rawPct (which no longer
  // includes these items at all — see QC_CRITICAL_ITEM_LABELS above). Two
  // items failing from the same group means two separate multiplications,
  // not one — deliberately more punishing than treating the group as a
  // single yes/no flag. Order across groups (worst-first) doesn't change the
  // final number (multiplication commutes) but keeps the banner readable.
  // Detect triggered deductions regardless of whether rawPct exists yet — an
  // auditor might score a critical item before scoring anything else, in
  // which case every section still has zero non-critical items scored and
  // rawPct is null. The banner should still name the failed field right
  // away rather than falling back to a vague generic message just because
  // there's no score yet to apply the deduction to.
  let pct=rawPct;
  const triggeredDeductions=[];
  QC_DEDUCTION_GROUPS.forEach(g=>{
    g.labels.forEach(label=>{
      if(qcItemFailedByLabel(label)){
        if(pct!==null) pct=pct*(1-g.pct/100);
        triggeredDeductions.push({pct:g.pct,label});
      }
    });
  });
  if(pct!==null) pct=Math.max(0,Math.round(pct));

  const numEl=document.getElementById('qcOverallScore');
  if(numEl){
    numEl.textContent=pct===null?'—':pct+'%';
    numEl.className='qc-score-num '+(pct===null?'na':pct<70?'fail':pct<90?'warn':'pass');
  }
  const errEl=document.getElementById('qcErrorCount');if(errEl)errEl.textContent=errCount;
  const progressEl=document.getElementById('qcProgress');if(progressEl)progressEl.textContent=`${scoredCount} / ${totalCount} scored`;
  const banner=document.getElementById('qcFatalBanner');
  if(banner){
    if(triggeredDeductions.length){
      banner.style.display='';
      const parts=triggeredDeductions.map(d=>escHtml(d.label)+' ('+d.pct+'% deduction)').join(', ');
      banner.innerHTML=rawPct===null
        ? '&#9888; '+parts+' — this will be deducted from the overall score once the rest of the audit is scored.'
        : '&#9888; '+parts+' — overall score reduced from '+rawPct+'% to '+pct+'%.';
    } else if(fatalFail){
      banner.style.display='';
      banner.innerHTML='&#9888; A fatal item is marked Fail. This is counted in the score and error count like any other item, but flagged here for visibility.';
    } else {
      banner.style.display='none';
    }
  }
  return {pct,rawPct,errCount,scoredCount,totalCount,fatalFail,triggeredDeductions};
}

  qcState={case:{},scores:qcDefaultScores(QC_SECTIONS)};
  qcSaveState();

}

function filterQC(val){
  const q=(val||'').trim().toLowerCase();
  const sections=document.querySelectorAll('#main .qc-sections-wrap .section');
  if(!q){
    sections.forEach(sec=>{
      sec.classList.remove('search-hidden');
      sec.querySelectorAll('.qc-row').forEach(r=>r.classList.remove('search-hidden'));
    });
    return;
  }
  sections.forEach(sec=>{
    const titleEl=sec.querySelector('.section-header span');
    const titleMatch=!!(titleEl&&titleEl.textContent.toLowerCase().includes(q));
    const rows=sec.querySelectorAll('.qc-row');
    let anyRowMatch=false;
    rows.forEach(row=>{
      const label=(row.querySelector('.qc-row-label')||{}).textContent||'';
      const question=(row.querySelector('.qc-row-question')||{}).textContent||'';
      const match=titleMatch||(label+' '+question).toLowerCase().includes(q);
      if(match){row.classList.remove('search-hidden');anyRowMatch=true;}
      else row.classList.add('search-hidden');
    });
    if(titleMatch||anyRowMatch){
      sec.classList.remove('search-hidden');
      const chevron=sec.querySelector('.chevron');
      const body=sec.querySelector('.section-body');
      if(chevron&&!chevron.classList.contains('open')){chevron.classList.add('open');if(body)body.style.display='';}
    } else {
      sec.classList.add('search-hidden');
    }
  });
}

function qcExpandAll(){
  document.querySelectorAll('#main .qc-sections-wrap .section').forEach(sec=>{
    const chevron=sec.querySelector('.chevron');
    const body=sec.querySelector('.section-body');
    if(chevron&&!chevron.classList.contains('open')){chevron.classList.add('open');if(body)body.style.display='';}
  });
}

function qcCollapseAll(){
  document.querySelectorAll('#main .qc-sections-wrap .section').forEach(sec=>{
    const chevron=sec.querySelector('.chevron');
    const body=sec.querySelector('.section-body');
    if(chevron&&chevron.classList.contains('open')){chevron.classList.remove('open');if(body)body.style.display='none';}
  });
}

// Shared searchable-dropdown combobox for any case field backed by
// QC_AGENT_NAME_OPTIONS — Agent Name and Auditor Name both draw from the
// same roster, so this is one component parameterized by field key rather
// than two near-duplicate copies. Strict select-only, same as before: typing
// only filters the list, never writes to state — only clicking an option
// (or landing exactly on it) does, so a typed-but-unselected name can never
// reach Save. Registered option lists are keyed by field (not a single
// shared array) since Agent Name and Auditor Name are independent
// comboboxes that can each have their own filtered list open.
let _qcNameComboboxOptionTargets={};
// "agentName" -> "AgentName" / "auditorName" -> "AuditorName", used to build
// each field's own element IDs (qcAgentNameInput, qcAuditorNameInput, ...)
// so the two comboboxes never collide, and the Agent Name IDs stay exactly
// what they were before this was generalized.
function qcNameComboboxIdBase(field){ return field.charAt(0).toUpperCase()+field.slice(1); }
function qcNameComboboxOptionsHtml(names,field){
  _qcNameComboboxOptionTargets[field]=names;
  if(!names.length) return `<div class="qc-analytics-dropdown-empty">No matching names</div>`;
  return names.map((name,idx)=>`<div class="qc-analytics-dropdown-option" onmousedown="event.preventDefault();qcSelectNameComboboxByIdx('${field}',${idx})">${escHtml(name)}</div>`).join('');
}
function qcFilterNameComboboxOptions(field,query){
  const q=(query||'').trim().toLowerCase();
  const filtered=QC_AGENT_NAME_OPTIONS.filter(n=>n.toLowerCase().includes(q));
  const panel=document.getElementById('qc'+qcNameComboboxIdBase(field)+'DropdownPanel');
  if(panel){ panel.innerHTML=qcNameComboboxOptionsHtml(filtered,field); panel.classList.add('open'); }
}
// Always the full list, not filtered to whatever's already selected — if a
// field already has a value and you click back into it, filtering by that
// value would show only itself as a match, defeating the point of opening
// the list to browse/change it. Typing afterward is what filters; opening
// should always start from "everything."
function qcOpenNameComboboxDropdown(field){
  qcFilterNameComboboxOptions(field, '');
}
// Runs on blur, delayed — clicking an option fires via onmousedown (which
// runs before blur and calls qcSelectNameComboboxByIdx directly), so by the
// time this timeout fires the state/input are already correct; this only
// needs to clean up when the user types a search then clicks away without
// picking anything, reverting the box back to whatever was actually saved.
function qcCloseNameComboboxDropdown(field){
  setTimeout(()=>{
    const idBase=qcNameComboboxIdBase(field);
    const panel=document.getElementById('qc'+idBase+'DropdownPanel');
    if(panel) panel.classList.remove('open');
    const input=document.getElementById('qc'+idBase+'Input');
    if(input) input.value=qcState.case[field]||'';
  },150);
}
function qcSelectNameComboboxByIdx(field,idx){
  const name=(_qcNameComboboxOptionTargets[field]||[])[idx];
  if(name==null) return;
  qcUpdateCase(field,name);
  const idBase=qcNameComboboxIdBase(field);
  const input=document.getElementById('qc'+idBase+'Input');
  if(input) input.value=name;
  const panel=document.getElementById('qc'+idBase+'DropdownPanel');
  if(panel) panel.classList.remove('open');
}
// Opens/closes the panel on demand, alongside (not instead of) the existing
// auto-open-on-focus — a manual trigger for anyone who wants to browse the
// full list without needing to click straight into the text box. Uses
// mousedown+preventDefault (same trick the option rows already use) so
// clicking the arrow doesn't blur the input first if it's already focused —
// otherwise the resulting blur would run its revert/close logic right
// before this toggle runs, making an "open" click look like a no-op.
//
// Opens directly via qcOpenNameComboboxDropdown() rather than relying on
// input.focus() to trigger it through the onfocus handler — .focus() is a
// no-op (fires no event) when the input is already the focused element,
// which happens the moment you've picked an option once (selecting doesn't
// blur the input, it just closes the panel), so depending on that side
// effect alone made every toggle after the first one silently do nothing.
function qcToggleNameComboboxDropdown(field){
  const idBase=qcNameComboboxIdBase(field);
  const panel=document.getElementById('qc'+idBase+'DropdownPanel');
  const input=document.getElementById('qc'+idBase+'Input');
  if(!panel||!input) return;
  if(panel.classList.contains('open')){
    panel.classList.remove('open');
    input.value=qcState.case[field]||'';

function stripHtml(html){
  return (html||'').replace(/<[^>]*>/g,'')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ')
    .replace(/&middot;/g,'·').replace(/&#8211;/g,'–').replace(/&#8212;/g,'—')
    .replace(/&#9654;/g,'').replace(/→/g,'→').trim();
}

function toggleDlMenu(btn){
  const menu=btn.nextElementSibling;
  const isOpen=menu.classList.contains('open');
  closeDlMenus();
  if(!isOpen) menu.classList.add('open');
}
function closeDlMenus(){
  document.querySelectorAll('.dl-menu.open').forEach(m=>m.classList.remove('open'));
}
document.addEventListener('click',function(e){

function downloadExcel(type){
  if(typeof XLSX==='undefined'){
    alert('Excel library not loaded.\nPlease check your internet connection and reload the page.');
    return;
  }
  const wb=XLSX.utils.book_new();
  const today=new Date().toISOString().slice(0,10);

  if(type==='script'){
    const p=programs.find(x=>x.id===currentProgId);
    if(!p){alert('No script selected.');return;}
    const script=currentTab==='pbm'?p.pbm:currentTab==='other'?p.other:p.mm;
    if(!script){alert('No script available for this tab.');return;}
    const aoa=[['Section #','Section Title','Step #','Type','Label','Text','Field / Answer']];
    script.forEach((sec,si)=>{
      sec.steps.forEach((step,ti)=>{
        aoa.push([si+1,sec.title||'',ti+1,step.type||'',stripHtml(step.label||''),stripHtml(step.text||''),step.field||'']);
      });
    });
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[10,28,8,12,14,70,35].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb,ws,(p.label+' '+currentTab.toUpperCase()).slice(0,31));
    XLSX.writeFile(wb,'Valeris_'+p.label.replace(/[^a-z0-9]/gi,'_')+'_'+currentTab.toUpperCase()+'_'+today+'.xlsx');
  }
  else if(type==='drugref'){
    const drugData=getDrugData();
    const aoa=[drugData.columns,...drugData.rows.map(r=>r.cells.map(c=>c||''))];
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[20,18,18,30,30,18,12,14,16,12,10,18].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb,ws,'Drug Reference');
    XLSX.writeFile(wb,'Valeris_Drug_Reference_'+today+'.xlsx');
  }
  else if(type==='terms'){
    const termsData=getTermsData();
    const aoa=[['Category','Name','Acronym','Definition','Context / Script']];
    termsData.terms.forEach(t=>{
      aoa.push([t.category||'',t.name||'',t.acronym||'',stripHtml(t.def||''),stripHtml(t.context||'')]);
    });
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[20,30,14,55,55].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb,ws,'Terminologies');
    XLSX.writeFile(wb,'Valeris_Terminologies_'+today+'.xlsx');
  }
  else if(type==='qc'){
    const meta=QC_KIND_META[currentQCKind];
    const c=qcState.case||{};
    const p=programs.find(x=>x.id===c.program);
    const r=qcRecalc();
    const aoa=[
      [meta.title],
      [],
      ['Audit Type','QC Internal Audit',meta.shortLabel+' Program',p?p.label:''],
      ['SR / Case Number',c.srNumber||'','Agent Name',c.agentName||''],
      ['Auditor Name',c.auditorName||'','Audit Date',c.auditDate||''],
      ['Payer Name',c.payerName||'','Payer Type',c.payerType||''],
      ['Type',c.type||'','Team Leader',c.teamLeader||''],
      ['# of Errors',r.errCount,'Overall Score',r.pct===null?'N/A':r.pct+'%'],
      ['Scored',`${r.scoredCount} / ${r.totalCount}`,'',''],
      [],
    ];
    const lbl=v=>v==='pass'?'Pass':v==='fail'?'Fail':v==='na'?'N/A':'';
    QC_SECTIONS.forEach((sec,si)=>{
      aoa.push([sec.title.toUpperCase(),'','ASKED','DOCUMENTED','WEIGHT','COMMENTS']);
      sec.items.forEach((it,ii)=>{
        const st=qcState.scores[si+'_'+ii]||{};
        aoa.push([it.label,it.q,lbl(st.asked),lbl(st.documented),it.w,st.comment||'']);
      });
    });
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[24,60,10,10,8,40].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb,ws,meta.title.slice(0,31));
    XLSX.writeFile(wb,'Valeris_'+meta.shortLabel+'_QC_'+(c.srNumber||'audit').replace(/[^a-z0-9]/gi,'_')+'_'+today+'.xlsx');
  }
}
